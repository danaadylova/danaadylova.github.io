name: Books data check

# Builds the site from real Goodreads data WITHOUT deploying, to verify the /books pipeline on a branch.
on:
  push:
    branches: ["feat/books-*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Restore Goodreads snapshot + covers
        uses: actions/cache@v4
        with:
          path: .cache/books
          key: books-${{ github.run_id }}
          restore-keys: books-
      - name: Build (fetches Goodreads, downloads covers)
        run: npm run build
      - name: Report
        run: node scripts/books-report.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: books-preview
          path: |
            _site/books
            _site/img/books
            _site/css
          retention-days: 7
