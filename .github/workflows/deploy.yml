name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Daily rebuild so new Goodreads reads show up without a commit (13:17 UTC ≈ 6am Pacific).
    - cron: "17 13 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Restore Goodreads snapshot + covers
        uses: actions/cache@v4
        with:
          path: .cache/books
          key: books-${{ github.run_id }}
          restore-keys: books-
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
