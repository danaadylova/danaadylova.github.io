<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dana Adylova</title>
  <meta name="description" content="Dana Adylova — developer and crafter in the Bay Area." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%A8%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #faf6ee;
      --ink:        #2b211a;
      --muted:      #8a7a5e;
      --accent:     #a9603a;
      --accent-2:   #b3874a;
      --card:       #ffffff;
      --border:     #e8dfc9;
    }

    html { background: var(--bg); }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--ink);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
    }

    main { max-width: 34rem; width: 100%; }

    h1 {
      font-family: 'Fraunces', serif;
      font-weight: 500;
      font-size: clamp(2.2rem, 6vw, 3rem);
      letter-spacing: -0.01em;
      margin-bottom: 0.75rem;
    }

    .intro {
      color: var(--muted);
      font-size: 1.05rem;
      margin-bottom: 2.5rem;
    }

    .intro em {
      font-family: 'Fraunces', serif;
      font-style: italic;
      color: var(--accent);
    }

    h2 {
      font-family: 'Fraunces', serif;
      font-weight: 500;
      font-size: 1.05rem;
      color: var(--accent-2);
      text-transform: lowercase;
      letter-spacing: 0.04em;
      margin-bottom: 1rem;
    }

    .projects { display: grid; gap: 0.85rem; margin-bottom: 2.5rem; }

    .project {
      display: block;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 1rem 1.25rem;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.15s ease, transform 0.15s ease;
    }

    .project:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .project .name {
      font-family: 'Fraunces', serif;
      font-weight: 500;
      font-size: 1.15rem;
      color: var(--accent);
      margin-bottom: 0.15rem;
    }

    .project .desc {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .links {
      display: flex;
      gap: 1.25rem;
      font-size: 0.95rem;
    }

    .links a {
      color: var(--muted);
      text-decoration: none;
      border-bottom: 1px solid var(--border);
      transition: color 0.15s ease, border-color 0.15s ease;
    }

    .links a:hover { color: var(--accent); border-color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>Dana Adylova</h1>
    <p class="intro">Developer and crafter in the Bay Area. I like building small, useful things — usually somewhere between <em>code</em> and <em>yarn</em>.</p>

    <h2>things I make</h2>
    <div class="projects">
      <a class="project" href="https://unraveled.danaadylova.com">
        <div class="name">unraveled makes 🧶</div>
        <div class="desc">Find knitting patterns that match your gauge, sorted by what knitters actually love.</div>
      </a>
    </div>

    <div class="links">
      <a href="https://github.com/danaadylova">GitHub</a>
      <a href="mailto:danaadylova@gmail.com">Email</a>
    </div>
  </main>
</body>
</html>
